# Dokploy writes variables from its Environment tab into .env.
# Route the domain to service app, container port 3001, using Dokploy Domains.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in Dokploy Environment}
      PORT: 3001
    expose: ["3001"]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 15s
      retries: 3
  worker:
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in Dokploy Environment}
    command: [npm, run, worker]
    depends_on:
      app:
        condition: service_healthy
